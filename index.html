<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blikjes Collectie</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      border-bottom: 2px solid #7c3aed;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #a78bfa;
      letter-spacing: -0.5px;
    }

    .hero {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      text-align: center;
      padding: 60px 24px;
      border-bottom: 1px solid #2d2d4e;
    }

    .hero h1 {
      font-size: 2.6rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
      text-shadow: 0 0 30px rgba(167, 139, 250, 0.5);
    }

    .hero p {
      font-size: 1rem;
      color: #a0aec0;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .section-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 24px;
    }

    .can-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .can-card {
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2d2d4e;
      text-align: center;
      padding-bottom: 18px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .can-card:hover {
      transform: translateY(-4px);
      border-color: #7c3aed;
      box-shadow: 0 10px 30px rgba(124, 58, 237, 0.25);
    }

    .can-thumb {
      height: 160px;
      background: #2d2d4e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .can-placeholder {
      width: 90px;
      height: 120px;
      background: #4a5568;
      border-radius: 10px;
      border: 2px solid #64748b;
    }

    .can-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      padding: 0 10px;
    }

    .rarity {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .rarity-common    { background: #6b7280; }
    .rarity-uncommon  { background: #22c55e; }
    .rarity-rare      { background: #3b82f6; }
    .rarity-epic      { background: #8b5cf6; }
    .rarity-legendary { background: #f97316; }
    .rarity-mythic    { background: #ef4444; }
    .rarity-secret    { background: #eab308; color: #000; }

    .scan-row {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .scan-btn {
      background: #7c3aed;
      color: #fff;
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .scan-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    #scan-status {
      font-size: 0.95rem;
      color: #a78bfa;
      min-height: 1.2em;
    }
    .can-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .upload-btn {
      margin-top: 8px;
      background: #2d2d4e;
      color: #a78bfa;
      border: 1px solid #2d2d4e;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .upload-btn:hover {
      background: #7c3aed;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 32px 24px;
      color: #4a5568;
      border-top: 1px solid #1a1a2e;
      font-size: 0.85rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">Blikjes Collectie</div>
    </div>
  </header>

  <section class="hero">
    <h1>Blikjes Collectie</h1>
    <p>Verzamel alle blikjes en voltooi je collectie.</p>
    <div class="scan-row">
      <input type="file" id="scan-input" accept="image/*" capture="environment" style="display:none">
      <button id="scan-btn" class="scan-btn" type="button">Scan blikje</button>
      <p id="scan-status"></p>
    </div>
  </section>

  <main>
    <h2 class="section-title">Alle Blikjes</h2>
    <div id="collection" class="can-grid"></div>
  </main>

  <footer>
    <p>Blikjes Collectie &copy; 2026</p>
  </footer>

  <script>
    const blikjes = [
      { naam: 'Coca-Cola Original',                  rarity: 'common' },
      { naam: 'Coca-Cola Zero Sugar',                rarity: 'common' },
      { naam: 'Fanta Orange',                        rarity: 'common' },
      { naam: 'Fanta Orange Zero',                   rarity: 'common' },
      { naam: 'Fanta Exotic',                        rarity: 'common' },
      { naam: 'Sprite',                              rarity: 'common' },
      { naam: 'Sprite Zero Sugar',                   rarity: 'common' },
      { naam: '7UP',                                 rarity: 'common' },
      { naam: 'Pepsi',                               rarity: 'common' },
      { naam: 'Pepsi Max',                           rarity: 'common' },
      { naam: 'Dr Pepper',                           rarity: 'common' },
      { naam: 'Lipton Ice Tea Sparkling',            rarity: 'common' },
      { naam: 'Lipton Ice Tea Green',                rarity: 'common' },
      { naam: 'Chocomel',                            rarity: 'common' },
      { naam: 'Fristi',                              rarity: 'common' },
      { naam: 'Schweppes Tonic',                     rarity: 'common' },
      { naam: 'Royal Club Cola',                     rarity: 'common' },
      { naam: 'Fanta Cassis',                        rarity: 'uncommon' },
      { naam: 'Fanta Exotic Zero',                   rarity: 'uncommon' },
      { naam: 'Fanta Sinas Zero',                    rarity: 'uncommon' },
      { naam: 'Sprite Lemon & Lime',                 rarity: 'uncommon' },
      { naam: '7UP Zero',                            rarity: 'uncommon' },
      { naam: 'Dr Pepper Zero Sugar',                rarity: 'uncommon' },
      { naam: 'Fernandes Cherry Bouquet',            rarity: 'uncommon' },
      { naam: 'Fernandes Green Punch',               rarity: 'uncommon' },
      { naam: 'Fernandes Super Pineapple',           rarity: 'uncommon' },
      { naam: 'Fuze Tea Peach Hibiscus',             rarity: 'uncommon' },
      { naam: 'Fuze Tea Green',                      rarity: 'uncommon' },
      { naam: 'Schweppes Bitter Lemon',              rarity: 'uncommon' },
      { naam: 'Schweppes Ginger Ale',                rarity: 'uncommon' },
      { naam: 'Royal Club Cassis',                   rarity: 'uncommon' },
      { naam: 'SiSi Sinas',                          rarity: 'uncommon' },
      { naam: 'Coca-Cola Cherry',                    rarity: 'rare' },
      { naam: 'Fanta Lemon',                         rarity: 'rare' },
      { naam: 'Fanta Lemon Zero',                    rarity: 'rare' },
      { naam: 'Pepsi Max Cherry',                    rarity: 'rare' },
      { naam: 'Pepsi Max Lime',                      rarity: 'rare' },
      { naam: 'Pepsi Max Mango',                     rarity: 'rare' },
      { naam: 'Fernandes Red Grape',                 rarity: 'rare' },
      { naam: 'Fernandes Cream Ginger',              rarity: 'rare' },
      { naam: 'Sanpellegrino Aranciata',             rarity: 'rare' },
      { naam: 'Sanpellegrino Limonata',              rarity: 'rare' },
      { naam: 'SiSi Sinas Zero Sugar',               rarity: 'rare' },
      { naam: 'Coca-Cola Cherry Zero',               rarity: 'epic' },
      { naam: 'Coca-Cola Lemon',                     rarity: 'epic' },
      { naam: 'Coca-Cola Zero Caffeine Zero Sugar',  rarity: 'epic' },
      { naam: 'Fanta Strawberry Kiwi',               rarity: 'epic' },
      { naam: 'Pepsi Max Lemon',                     rarity: 'epic' },
      { naam: 'Dr Pepper Vanilla',                   rarity: 'epic' },
      { naam: 'Sanpellegrino Rossa',                 rarity: 'epic' },
      { naam: 'Coca-Cola Vanilla',                   rarity: 'legendary' },
      { naam: 'Fanta Pineapple Grapefruit Zero',     rarity: 'legendary' },
      { naam: 'Jumbo Cola Grapefruit',               rarity: 'legendary' },
      { naam: 'Jumbo Cola Lime Mint',                rarity: 'legendary' },
      { naam: 'Jumbo Cola Vanille',                  rarity: 'legendary' }
    ];

    const fotosRaw = localStorage.getItem('blikjes_fotos');
    const fotos = fotosRaw ? JSON.parse(fotosRaw) : {};
    const cards = {};

    function saveFoto(naam, dataUrl) {
      fotos[naam] = dataUrl;
      localStorage.setItem('blikjes_fotos', JSON.stringify(fotos));
      updateCardFoto(naam, dataUrl);
    }

    function updateCardFoto(naam, dataUrl) {
      const card = cards[naam];
      if (!card) return;
      const thumb = card.querySelector('.can-thumb');
      thumb.innerHTML = '';
      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = naam;
      img.className = 'can-foto';
      thumb.appendChild(img);
    }

    function createCard(b) {
      const card = document.createElement('div');
      card.className = 'can-card';
      card.innerHTML = `
        <div class="can-thumb"></div>
        <div class="can-name"></div>
        <span class="rarity rarity-${b.rarity}">${b.rarity}</span>
        <button class="upload-btn" type="button">Foto</button>
      `;
      card.querySelector('.can-name').textContent = b.naam;
      card.querySelector('.upload-btn').addEventListener('click', () => uploadFor(b.naam));
      cards[b.naam] = card;
      if (fotos[b.naam]) updateCardFoto(b.naam, fotos[b.naam]);
      else card.querySelector('.can-thumb').appendChild(Object.assign(document.createElement('div'), { className: 'can-placeholder' }));
      return card;
    }

    const container = document.getElementById('collection');
    blikjes.forEach(b => container.appendChild(createCard(b)));

    function compressImage(file, maxSide = 300) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve({ dataUrl: canvas.toDataURL('image/jpeg', 0.85), canvas });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function uploadFor(naam) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.display = 'none';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (file) saveFoto(naam, (await compressImage(file, 300)).dataUrl);
        input.remove();
      };
      document.body.appendChild(input);
      input.click();
    }

    async function scanBlikje(file) {
      const status = document.getElementById('scan-status');
      if (status.dataset.busy === 'true') return;
      status.dataset.busy = 'true';
      status.textContent = 'Bezig met lezen van de foto...';
      try {
        const { dataUrl, canvas } = await compressImage(file, 400);
        const worker = await Tesseract.createWorker('eng');
        const { data: { text } } = await worker.recognize(canvas);
        await worker.terminate();
        const match = findMatch(text.toLowerCase());
        if (match) {
          saveFoto(match, dataUrl);
          status.textContent = `Herkend: ${match}`;
        } else {
          status.textContent = 'Niet automatisch herkend. Type de naam in het volgende venster.';
          chooseBlikje(dataUrl);
        }
      } catch (err) {
        console.error(err);
        status.textContent = 'Fout bij scannen. Gebruik de Foto-knop op de kaart.';
      } finally {
        status.dataset.busy = 'false';
      }
    }

    function findMatch(text) {
      let best = null;
      let bestScore = 0;
      for (const b of blikjes) {
        const words = b.naam.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
        const score = words.reduce((s, w) => s + (text.includes(w) ? 1 : 0), 0);
        if (score > bestScore) {
          bestScore = score;
          best = b.naam;
        }
      }
      return bestScore > 0 ? best : null;
    }

    function chooseBlikje(dataUrl) {
      const naam = prompt('Voor welk blikje is deze foto? (typ exact de naam)');
      if (!naam) return;
      const best = blikjes.find(b => b.naam.toLowerCase() === naam.toLowerCase());
      if (best) saveFoto(best.naam, dataUrl);
      else document.getElementById('scan-status').textContent = 'Naam niet gevonden.';
    }

    document.getElementById('scan-btn').addEventListener('click', () => {
      document.getElementById('scan-input').click();
    });

    document.getElementById('scan-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) scanBlikje(file);
      e.target.value = '';
    });
  </script>
</body>
</html>
